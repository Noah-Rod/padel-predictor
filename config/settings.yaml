# Non-secret configuration for all three FTI pipelines.
# Secrets (API keys, credentials) come from the environment only -- see .env.example.

ingestion:
  # How many days of matches a normal (non-backfill) run pulls from the live source.
  lookback_days: 7
  # Request timeout in seconds for the live source.
  timeout_seconds: 30
  max_retries: 3
  # Ranking snapshots are re-read this many days before each window.
  rankings_lookback_days: 14
  # Backfilled ranking snapshots have no publication time; they count as
  # published this many days after their label date, so a snapshot labelled
  # with a tournament week is never joined onto that week's matches.
  rankings_publication_lag_days: 7
  # PADEL_API_PLAN=free only reaches this far back (and has no ranking history).
  free_plan_history_days: 183
  # padelapi.org levels in scope (proposal: Premier Padel plus FIP Platinum and Gold).
  levels: [major, p1, p2, finals, fip_platinum, fip_gold]
  page_size: 50
  # Pacing per PADEL_API_PLAN, just under the provider's limits (10 and 60 per minute).
  requests_per_minute:
    free: 9
    paid: 55
  # Pages of 50 per ranking list (official points, Elo), category and week: top 200.
  rankings_max_pages: 4
  # A 429 asking to wait longer than this means the daily quota is used up.
  max_retry_after_seconds: 120

features:
  # Elo rating state shared by training and inference (see common/features.py).
  elo_initial: 1500.0
  elo_k_factor: 24.0
  # Number of recent matches used for the rolling "form" feature.
  form_window: 5
  # Ordinal encoding of the tour tier; unknown tiers fall back to 0.
  tier_levels:
    major: 4
    finals: 4
    p1: 3
    p2: 2
    fip_platinum: 1
    fip_gold: 1
    challenger: 1

training:
  # Fraction of the most recent matches held out as the test set (time-based split).
  test_fraction: 0.2
  # Minimum number of labelled matches before training is allowed to run.
  min_training_rows: 200
  random_state: 42
  model:
    # Passed to sklearn.ensemble.HistGradientBoostingClassifier.
    max_iter: 300
    learning_rate: 0.06
    max_depth: 4
    l2_regularization: 1.0
    early_stopping: true
  promotion:
    # A new model only becomes champion if it beats the current one on this metric
    # by at least `min_improvement` (log loss: lower is better).
    metric: log_loss
    higher_is_better: false
    min_improvement: 0.002
  evaluation:
    # Success criterion: the model beats the provider-Elo baseline only if the
    # whole bootstrap confidence interval of the log-loss difference
    # (model minus baseline, paired over the same test matches) is below zero.
    bootstrap_samples: 2000
    confidence: 0.95

inference:
  # How far ahead the batch inference pipeline looks for unplayed matches.
  horizon_days: 7
