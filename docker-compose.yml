# Local stack: prediction API and UI. Tracking and the feature store are hosted
# (W&B, Hopsworks) or, with the defaults from .env.example, local files in the
# shared data volume.
# Copy .env.example to .env first -- Compose reads it automatically.

services:
  api:
    build: .
    command: ["padel", "serve"]
    environment:
      PADEL_FEATURE_STORE_URI: ${PADEL_FEATURE_STORE_URI:-/app/data/feature_store}
      HOPSWORKS_API_KEY: ${HOPSWORKS_API_KEY:-}
      HOPSWORKS_HOST: ${HOPSWORKS_HOST:-}
      PADEL_TRACKING: ${PADEL_TRACKING:-local}
      PADEL_MODEL_REGISTRY_DIR: /app/data/model_registry
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      WANDB_PROJECT: ${WANDB_PROJECT:-padel-predictor}
      WANDB_ENTITY: ${WANDB_ENTITY:-}
      PADEL_SOURCE: ${PADEL_SOURCE:-sample}
      PADEL_API_BASE_URL: ${PADEL_API_BASE_URL:-}
      PADEL_API_KEY: ${PADEL_API_KEY:-}
      PADEL_API_PLAN: ${PADEL_API_PLAN:-paid}
    ports:
      - "8000:8000"
    volumes:
      - data:/app/data

  ui:
    build: .
    command:
      ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      PADEL_FEATURE_STORE_URI: ${PADEL_FEATURE_STORE_URI:-/app/data/feature_store}
      HOPSWORKS_API_KEY: ${HOPSWORKS_API_KEY:-}
      HOPSWORKS_HOST: ${HOPSWORKS_HOST:-}
      PADEL_TRACKING: ${PADEL_TRACKING:-local}
      PADEL_MODEL_REGISTRY_DIR: /app/data/model_registry
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      WANDB_PROJECT: ${WANDB_PROJECT:-padel-predictor}
      WANDB_ENTITY: ${WANDB_ENTITY:-}
      PADEL_API_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - data:/app/data
    depends_on:
      - api

  # One-shot pipeline runs:
  #   docker compose run --rm pipelines padel backfill --start 2025-09-01 --end 2026-09-01
  #   docker compose run --rm pipelines padel training-pipeline
  pipelines:
    build: .
    profiles: ["tools"]
    entrypoint: []
    command: ["padel", "--help"]
    environment:
      PADEL_FEATURE_STORE_URI: ${PADEL_FEATURE_STORE_URI:-/app/data/feature_store}
      HOPSWORKS_API_KEY: ${HOPSWORKS_API_KEY:-}
      HOPSWORKS_HOST: ${HOPSWORKS_HOST:-}
      PADEL_TRACKING: ${PADEL_TRACKING:-local}
      PADEL_MODEL_REGISTRY_DIR: /app/data/model_registry
      WANDB_API_KEY: ${WANDB_API_KEY:-}
      WANDB_PROJECT: ${WANDB_PROJECT:-padel-predictor}
      WANDB_ENTITY: ${WANDB_ENTITY:-}
      PADEL_SOURCE: ${PADEL_SOURCE:-sample}
      PADEL_API_BASE_URL: ${PADEL_API_BASE_URL:-}
      PADEL_API_KEY: ${PADEL_API_KEY:-}
      PADEL_API_PLAN: ${PADEL_API_PLAN:-paid}
    volumes:
      - data:/app/data

volumes:
  data:
