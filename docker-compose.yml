# Local stack: tracking server, prediction API and UI.
# Copy .env.example to .env first -- Compose reads it automatically.

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    command: ["padel", "serve"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PADEL_FEATURE_STORE_URI: /app/data/feature_store
      PADEL_SOURCE: ${PADEL_SOURCE:-sample}
      PADEL_API_BASE_URL: ${PADEL_API_BASE_URL:-}
      PADEL_API_KEY: ${PADEL_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - data:/app/data
    depends_on:
      mlflow:
        condition: service_healthy

  ui:
    build: .
    command:
      ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PADEL_FEATURE_STORE_URI: /app/data/feature_store
      PADEL_API_URL: http://api:8000
    ports:
      - "8501:8501"
    volumes:
      - data:/app/data
    depends_on:
      - api

  # One-shot pipeline runs:
  #   docker compose run --rm pipelines padel backfill --start 2025-09-01 --end 2026-09-01
  #   docker compose run --rm pipelines padel training-pipeline
  pipelines:
    build: .
    profiles: ["tools"]
    entrypoint: []
    command: ["padel", "--help"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PADEL_FEATURE_STORE_URI: /app/data/feature_store
      PADEL_SOURCE: ${PADEL_SOURCE:-sample}
      PADEL_API_BASE_URL: ${PADEL_API_BASE_URL:-}
      PADEL_API_KEY: ${PADEL_API_KEY:-}
    volumes:
      - data:/app/data
    depends_on:
      mlflow:
        condition: service_healthy

volumes:
  data:
  mlflow:
