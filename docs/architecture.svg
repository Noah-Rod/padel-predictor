<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580" font-family="Liberation Sans, DejaVu Sans, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366f1"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#db2777"/>
    </marker>
  </defs>
  <rect width="1080" height="580" fill="#ffffff"/>

  <!-- orchestration band -->
  <rect x="250" y="15" width="800" height="44" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="650" y="34" text-anchor="middle" font-weight="bold" fill="#3730a3">GitHub Actions: cron + workflow_dispatch</text>
  <text x="650" y="51" text-anchor="middle" fill="#3730a3">CI on every push: ruff, pytest, Docker build</text>

  <!-- source -->
  <rect x="20" y="110" width="200" height="125" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="120" y="135" text-anchor="middle" font-weight="bold">padelapi.org</text>
  <text x="120" y="156" text-anchor="middle">REST · JSON · API key</text>
  <text x="120" y="174" text-anchor="middle">results · schedules · draws</text>
  <text x="120" y="192" text-anchor="middle">weekly rankings</text>
  <text x="120" y="218" text-anchor="middle" fill="#6b7280" font-size="11">updates Wed–Sun, tour weeks</text>

  <!-- feature pipeline -->
  <rect x="250" y="95" width="250" height="205" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="375" y="118" text-anchor="middle" font-weight="bold" fill="#065f46">1 · Feature pipeline</text>
  <text x="375" y="135" text-anchor="middle" fill="#065f46">daily 04:15 UTC · backfill on demand</text>
  <text x="262" y="160">• fetch 7-day window, backfill 2023+</text>
  <text x="262" y="179">• validate raw-match schema</text>
  <text x="262" y="198">• drop walkovers, dedupe match_id</text>
  <text x="262" y="217">• replay Elo, form, rest, partnership</text>
  <text x="262" y="236">• as-of join of weekly rankings</text>
  <text x="262" y="255">• write feature groups</text>
  <text x="375" y="284" text-anchor="middle" fill="#6b7280" font-size="11">common/features.py: one definition</text>

  <!-- feature store -->
  <rect x="530" y="95" width="240" height="205" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="650" y="118" text-anchor="middle" font-weight="bold" fill="#92400e">Hopsworks feature store</text>
  <text x="542" y="145">match_features</text>
  <text x="542" y="160" fill="#6b7280" font-size="11">key match_id · event_time played_at</text>
  <text x="542" y="183">player_rankings</text>
  <text x="542" y="198" fill="#6b7280" font-size="11">key player_id · weekly snapshot</text>
  <text x="542" y="221">predictions</text>
  <text x="542" y="236" fill="#6b7280" font-size="11">key match_id · run_date</text>
  <text x="650" y="262" text-anchor="middle" fill="#92400e">feature view = point-in-time join</text>
  <text x="650" y="284" text-anchor="middle" fill="#6b7280" font-size="11">hosted · serverless</text>

  <!-- training pipeline -->
  <rect x="800" y="95" width="250" height="205" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="925" y="118" text-anchor="middle" font-weight="bold" fill="#1e40af">2 · Training pipeline</text>
  <text x="925" y="135" text-anchor="middle" fill="#1e40af">weekly Mon 05:30 UTC · on demand</text>
  <text x="812" y="160">• read feature view (labelled rows)</text>
  <text x="812" y="179">• out-of-time split, cut at tournament</text>
  <text x="812" y="198">• train gradient-boosted classifier</text>
  <text x="812" y="217">• evaluate vs provider Elo</text>
  <text x="812" y="236">• log run, register version</text>
  <text x="812" y="255">• promote only if it beats champion</text>

  <!-- stretch -->
  <rect x="20" y="380" width="200" height="100" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="120" y="404" text-anchor="middle" font-weight="bold" fill="#4b5563">Stretch (optional)</text>
  <text x="120" y="426" text-anchor="middle" fill="#4b5563">Evidently drift reports</text>
  <text x="120" y="444" text-anchor="middle" fill="#4b5563">Grafana dashboard</text>
  <text x="120" y="462" text-anchor="middle" fill="#4b5563">Terraform: bucket, Cloud Run</text>

  <!-- inference pipeline -->
  <rect x="250" y="380" width="250" height="140" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="375" y="403" text-anchor="middle" font-weight="bold" fill="#5b21b6">3 · Inference pipeline</text>
  <text x="375" y="420" text-anchor="middle" fill="#5b21b6">daily 06:00 UTC · on demand</text>
  <text x="262" y="445">• load champion model</text>
  <text x="262" y="464">• score fixtures up to 7 days ahead</text>
  <text x="262" y="483">• write predictions</text>
  <text x="262" y="502">• score last pre-match predictions</text>

  <!-- W&B -->
  <rect x="530" y="380" width="240" height="95" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="650" y="403" text-anchor="middle" font-weight="bold" fill="#9d174d">Weights &amp; Biases</text>
  <text x="650" y="424" text-anchor="middle">experiments · model registry</text>
  <text x="650" y="441" text-anchor="middle">alias: champion (provider Elo first)</text>
  <text x="650" y="460" text-anchor="middle">weekly log loss / accuracy charts</text>

  <!-- serving -->
  <rect x="800" y="380" width="250" height="140" rx="8" fill="#f9fafb" stroke="#374151" stroke-width="1.5"/>
  <text x="925" y="403" text-anchor="middle" font-weight="bold">Google Cloud Run</text>
  <text x="925" y="425" text-anchor="middle">Streamlit UI (core)</text>
  <text x="925" y="442" text-anchor="middle" fill="#6b7280" font-size="11">upcoming matches with P(A wins),</text>
  <text x="925" y="457" text-anchor="middle" fill="#6b7280" font-size="11">weekly accuracy chart</text>
  <text x="925" y="481" text-anchor="middle" fill="#4b5563">FastAPI /predict (optional)</text>
  <text x="925" y="504" text-anchor="middle" fill="#6b7280" font-size="11">users: padel enthusiasts</text>

  <!-- orchestration arrows -->
  <line x1="375" y1="59" x2="375" y2="93" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrv)"/>
  <line x1="925" y1="59" x2="925" y2="93" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrv)"/>
  <path d="M 262 59 L 262 75 L 235 75 L 235 450 L 248 450" fill="none" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrv)"/>

  <!-- data flow -->
  <line x1="220" y1="172" x2="248" y2="172" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="500" y1="172" x2="528" y2="172" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="770" y1="172" x2="798" y2="172" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="514" y="165" text-anchor="middle" fill="#6b7280" font-size="10">write</text>
  <text x="784" y="165" text-anchor="middle" fill="#6b7280" font-size="10">read</text>

  <!-- store <-> inference: fixtures in, predictions out -->
  <path d="M 600 300 L 600 340 L 420 340 L 420 378" fill="none" stroke="#374151" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="510" y="334" text-anchor="middle" fill="#6b7280" font-size="10">fixtures in · predictions out</text>

  <!-- training -> W&B -->
  <path d="M 925 300 L 925 340 L 700 340 L 700 378" fill="none" stroke="#db2777" stroke-width="1.5" marker-end="url(#arrp)"/>
  <text x="815" y="334" text-anchor="middle" fill="#9d174d" font-size="10">log run · register · promote</text>

  <!-- W&B -> inference (champion) and inference -> W&B (monitoring) -->
  <line x1="528" y1="430" x2="502" y2="430" stroke="#db2777" stroke-width="1.5" marker-end="url(#arrp)"/>
  <text x="515" y="423" text-anchor="middle" fill="#9d174d" font-size="10">champion</text>
  <line x1="502" y1="462" x2="528" y2="462" stroke="#db2777" stroke-width="1.5" marker-end="url(#arrp)"/>
  <text x="515" y="476" text-anchor="middle" fill="#9d174d" font-size="10">monitoring</text>

  <!-- inference -> serving (predictions table), routed under W&B -->
  <path d="M 375 520 L 375 550 L 925 550 L 925 522" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="650" y="544" text-anchor="middle" fill="#6b7280" font-size="10">predictions table (daily)</text>
</svg>
