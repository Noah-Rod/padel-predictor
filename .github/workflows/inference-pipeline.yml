name: Inference pipeline

on:
  schedule:
    # Daily at 06:00 UTC, after the feature pipeline has refreshed the fixtures.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inference-pipeline
  cancel-in-progress: true


defaults:
  run:
    # pipefail: the commands are piped through tee, which would otherwise turn
    # a failed pipeline into a green run.
    shell: bash

jobs:
  predict:
    name: predict upcoming matches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PADEL_FEATURE_STORE_URI: ${{ vars.PADEL_FEATURE_STORE_URI || 'data/feature_store' }}
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_HOST: ${{ vars.HOPSWORKS_HOST }}
      PADEL_TRACKING: ${{ vars.PADEL_TRACKING || 'local' }}
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      WANDB_PROJECT: ${{ vars.WANDB_PROJECT || 'padel-predictor' }}
      WANDB_ENTITY: ${{ vars.WANDB_ENTITY }}
      PADEL_MODEL_ALIAS: ${{ vars.PADEL_MODEL_ALIAS || 'champion' }}
      HAS_GCP: ${{ secrets.GCP_SA_KEY != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Authenticate to Google Cloud
        if: env.HAS_GCP == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Predict
        run: uv run padel inference-pipeline | tee -a "$GITHUB_STEP_SUMMARY"
