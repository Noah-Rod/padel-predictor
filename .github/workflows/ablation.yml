name: Ablations

# On demand: retrain without partnership, form and rest in turn, on the same
# split as the training pipeline, and log every variant to W&B (job type
# "ablation"). Nothing is registered or promoted.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ablation
  cancel-in-progress: false

defaults:
  run:
    # pipefail: the command is piped through tee, which would otherwise turn a
    # failed run into a green one.
    shell: bash

jobs:
  ablate:
    name: drop each feature in turn
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PADEL_FEATURE_STORE_URI: ${{ vars.PADEL_FEATURE_STORE_URI || 'data/feature_store' }}
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_HOST: ${{ vars.HOPSWORKS_HOST }}
      PADEL_TRACKING: ${{ vars.PADEL_TRACKING || 'local' }}
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      WANDB_PROJECT: ${{ vars.WANDB_PROJECT || 'padel-predictor' }}
      WANDB_ENTITY: ${{ vars.WANDB_ENTITY }}
      PADEL_API_PLAN: ${{ vars.PADEL_API_PLAN || 'paid' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Ablate
        run: uv run padel ablation | tee -a "$GITHUB_STEP_SUMMARY"
