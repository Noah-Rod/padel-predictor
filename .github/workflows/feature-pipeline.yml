name: Feature pipeline

on:
  schedule:
    # Every day at 04:15 UTC, after the previous day's matches have settled.
    - cron: "15 4 * * *"
  workflow_dispatch:
    inputs:
      backfill_start:
        description: "Backfill from this date (YYYY-MM-DD). Leave empty for a normal incremental run."
        required: false
        type: string
      backfill_end:
        description: "Backfill up to this date (YYYY-MM-DD)."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Never let two runs write the feature store at the same time.
  group: feature-pipeline
  cancel-in-progress: false


defaults:
  run:
    # pipefail: the commands are piped through tee, which would otherwise turn
    # a failed pipeline into a green run.
    shell: bash

jobs:
  run:
    name: ingest and build features
    runs-on: ubuntu-latest
    # A backfill is paced under the provider's rate limit: about 20 min per year.
    timeout-minutes: 120
    env:
      # No fallbacks: a scheduled run on synthetic data or on the runner's disk
      # would look green and add nothing, so "Check the configuration" fails it.
      PADEL_SOURCE: ${{ vars.PADEL_SOURCE }}
      PADEL_API_BASE_URL: ${{ vars.PADEL_API_BASE_URL }}
      PADEL_API_KEY: ${{ secrets.PADEL_API_KEY }}
      PADEL_API_PLAN: ${{ vars.PADEL_API_PLAN || 'paid' }}
      PADEL_FEATURE_STORE_URI: ${{ vars.PADEL_FEATURE_STORE_URI }}
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_HOST: ${{ vars.HOPSWORKS_HOST }}
      HAS_GCP: ${{ secrets.GCP_SA_KEY != '' }}

    steps:
      - name: Check the configuration
        run: |
          failed=0
          if [ -z "$PADEL_SOURCE" ]; then
            echo "::error::The repository variable PADEL_SOURCE is not set. Set it to http: this workflow does not fall back to the synthetic sample source."
            failed=1
          fi
          case "$PADEL_FEATURE_STORE_URI" in
            hopsworks://*|gs://*) ;;
            *)
              echo "::error::The repository variable PADEL_FEATURE_STORE_URI must be hopsworks://<project> (or gs://<bucket>), got '${PADEL_FEATURE_STORE_URI}'. A local path is the runner's disk, which is discarded when the job ends."
              failed=1
              ;;
          esac
          if [ "$failed" -ne 0 ]; then
            echo "Not run: PADEL_SOURCE and PADEL_FEATURE_STORE_URI must be set as repository variables (README, Going live)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Authenticate to Google Cloud
        if: env.HAS_GCP == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Backfill
        if: inputs.backfill_start != '' && inputs.backfill_end != ''
        run: |
          uv run padel backfill \
            --start "${{ inputs.backfill_start }}" \
            --end "${{ inputs.backfill_end }}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Incremental run
        if: inputs.backfill_start == '' || inputs.backfill_end == ''
        run: uv run padel feature-pipeline | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Data report
        # Counts per season and tier and the baselines on the test split, read
        # back from the store. A report problem must not block training.
        continue-on-error: true
        run: |
          echo "## What is in the feature store" >> "$GITHUB_STEP_SUMMARY"
          uv run padel data-report | tee -a "$GITHUB_STEP_SUMMARY"
