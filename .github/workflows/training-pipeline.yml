name: Training pipeline

on:
  schedule:
    # Weekly retrain, Monday 05:30 UTC -- after the weekend's tournaments have
    # been ingested by the feature pipeline.
    - cron: "30 5 * * 1"
  workflow_dispatch:
  workflow_run:
    # Also retrain right after a manual backfill has reshaped the feature store.
    workflows: ["Feature pipeline"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: training-pipeline
  cancel-in-progress: false


defaults:
  run:
    # pipefail: the commands are piped through tee, which would otherwise turn
    # a failed pipeline into a green run.
    shell: bash

jobs:
  train:
    name: train, evaluate and promote
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # On a workflow_run trigger, only retrain when the feature pipeline succeeded.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      PADEL_FEATURE_STORE_URI: ${{ vars.PADEL_FEATURE_STORE_URI || 'data/feature_store' }}
      HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
      HOPSWORKS_HOST: ${{ vars.HOPSWORKS_HOST }}
      PADEL_TRACKING: ${{ vars.PADEL_TRACKING || 'local' }}
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
      WANDB_PROJECT: ${{ vars.WANDB_PROJECT || 'padel-predictor' }}
      WANDB_ENTITY: ${{ vars.WANDB_ENTITY }}
      HAS_GCP: ${{ secrets.GCP_SA_KEY != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Authenticate to Google Cloud
        if: env.HAS_GCP == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Warn about an ephemeral tracking backend
        if: ${{ vars.PADEL_TRACKING != 'wandb' }}
        run: |
          echo "::warning::PADEL_TRACKING is not 'wandb', so the run and the registered model are"
          echo "::warning::written to the runner's disk and discarded when the job ends."
          echo "Set PADEL_TRACKING=wandb and the WANDB_API_KEY secret." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Train
        run: uv run padel training-pipeline | tee -a "$GITHUB_STEP_SUMMARY"
