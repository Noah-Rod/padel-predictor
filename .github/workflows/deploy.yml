name: Deploy

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "notebooks/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  image:
    name: build and publish the image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cloud-run:
    name: deploy the API to Cloud Run
    runs-on: ubuntu-latest
    needs: image
    # Runs only once the GCP secrets are configured.
    if: ${{ vars.GCP_PROJECT_ID != '' && vars.CLOUD_RUN_SERVICE != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          image: ghcr.io/${{ github.repository }}:latest
          region: ${{ vars.GCP_REGION || 'europe-west6' }}
          env_vars: |
            PADEL_FEATURE_STORE_URI=${{ vars.PADEL_FEATURE_STORE_URI }}
            MLFLOW_TRACKING_URI=${{ vars.MLFLOW_TRACKING_URI }}
            PADEL_MODEL_ALIAS=${{ vars.PADEL_MODEL_ALIAS || 'champion' }}

  hugging-face:
    name: deploy the UI to a Hugging Face Space
    runs-on: ubuntu-latest
    needs: image
    # Runs only once HF_SPACE_ID is set and HF_TOKEN is available.
    if: ${{ vars.HF_SPACE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_SPACE_ID is set but the HF_TOKEN secret is missing."
            exit 1
          fi
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_ID}" \
            HEAD:refs/heads/main
