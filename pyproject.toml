[project]
name = "padel-predictor"
version = "0.1.0"
description = "Live ML system predicting professional padel match outcomes (HSLU MLOps HS26)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Noah Rodriguez" }]

dependencies = [
    "pandas>=2.2,<3",
    "pyarrow>=17,<22",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "mlflow>=2.16,<4",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
    "pyyaml>=6,<7",
    "typer>=0.12,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "streamlit>=1.38,<2",
]

[project.optional-dependencies]
# Object-storage backend for the feature store (gs:// URIs).
gcs = ["gcsfs>=2024.6,<2026"]

[project.scripts]
padel = "padel_predictor.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/padel_predictor"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/padel_predictor"]
